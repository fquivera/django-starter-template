[project]
name = "django-starter-template"
version = "0.1.0"
description = "Production-ready Django + HTMX + DaisyUI + Alpine.js starter template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1.0,<6.0.0",
    "django-environ>=0.11.2",
    "whitenoise[brotli]>=6.8.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
    "django-htmx>=1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "migrations",
    ".venv",
    "static",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001", "E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--strict-markers --reuse-db"
testpaths = ["apps"]
