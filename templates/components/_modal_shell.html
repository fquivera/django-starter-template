<!-- Dynamic Server-Rendered Modal Shell (DaisyUI 5 native dialog + Alpine.js) -->
<dialog
    id="global-modal"
    class="modal"
    x-data="{
        open() {
            if (!this.$el.open) {
                this.$el.showModal();
            }
        },
        close() {
            if (this.$el.open) {
                this.$el.close();
            }
        },
        reset() {
            this.$refs.modalContent.innerHTML = this.$refs.loadingTemplate.innerHTML;
        }
    }"
    x-on:open-modal.window="open()"
    x-on:close-modal.window="close()"
    x-on:close="reset()"
>
    <div
        id="modal-content"
        x-ref="modalContent"
        class="modal-box w-11/12 max-w-lg bg-base-100 p-6 shadow-2xl"
    >
        <!-- Content dynamically swapped via HTMX -->
        <div class="flex items-center justify-center py-8">
            <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
    </div>

    <form method="dialog" class="modal-backdrop">
        <button type="submit">close</button>
    </form>

    <template x-ref="loadingTemplate">
        <div class="flex items-center justify-center py-8">
            <span class="loading loading-spinner loading-lg text-primary"></span>
        </div>
    </template>
</dialog>
