name: Bug Report
description: Reporta un error o comportamiento inesperado en la plantilla.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudarnos a mejorar esta plantilla. Completa los detalles para poder reproducir el problema rápidamente.

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Explica qué ocurrió y en qué parte del proyecto sucede.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Comandos o acciones exactas para reproducir el error.
      placeholder: |
        1. Ejecutar `uv sync && npm install`
        2. Ir a `...`
        3. Observar el error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué esperabas que ocurriera.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Versiones locales relevantes.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS / Windows WSL2
        - Python: 3.12
        - uv:
        - Node.js:
    validations:
      required: false
