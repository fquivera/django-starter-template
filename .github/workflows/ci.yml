name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies and build CSS
        run: |
          npm ci
          npm run build:css

      - name: Verify compiled CSS has no drift
        run: git diff --exit-code -- static/css/dist/output.css

      - name: Validate Docker Compose config
        run: |
          docker compose config --quiet
          docker compose --profile async config --quiet

  django:
    name: Django Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Django system check
        run: uv run python manage.py check

      - name: Verify migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django deployment check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-test-secret-key-with-at-least-fifty-characters-long-1234567890
          DJANGO_ALLOWED_HOSTS: example.com
          DATABASE_URL: sqlite:///db.sqlite3
        run: uv run python manage.py check --deploy --fail-level WARNING

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run pytest suite
        run: uv run pytest
